# Based on src/bootstrap/defaults/bootstrap.dists.toml

[build]
host = [ "aarch64-apple-darwin" ]
target = [ "x86_64-apple-darwin", "aarch64-apple-darwin" ]
docs = false
extended = true

### In case of using custom built Rust, uncomment and modify these line
# rustc = "/Users/test/.rustup/toolchains/1.81.0-custom/bin/rustc"
# cargo = "/Users/test/.rustup/toolchains/1.81.0-custom/bin/cargo"

submodules = false
tools = [ "cargo" ]
cargo-native-static = true

[llvm]
download-ci-llvm = false
libzstd = false
static-libstdcpp = true
# targets = "X86"
targets = "X86;AArch64"
experimental-targets = ""

### In case of use pre-installed llvm, uncomment and adjust these lines
# [target.x86_64-apple-darwin]
# llvm-config = "/opt/local/bin/llvm-config-mp-18"

[rust]
channel = "dev"
optimize = "s"
codegen-tests = false

[install]
prefix = "build/1.74.0-custom-crosscompiling"
sysconfdir = "etc"