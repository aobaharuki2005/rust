# Based on src/bootstrap/defaults/bootstrap.dists.toml

[build]
host = [ "x86_64-apple-darwin" ]
target = [ "x86_64-apple-darwin" ]
docs = false
extended = true

### In case of using custom built Rust, uncomment and modify these line
rustc = "/tmp/bootstrap/1.82.0-custom-aarch64/bin/rustc"
cargo = "/tmp/bootstrap/1.82.0-custom-aarch64/bin/cargo"

submodules = false
tools = [ "cargo" ]
cargo-native-static = true

[llvm]
download-ci-llvm = false
libzstd = false   # available since Rust 1.82.0
static-libstdcpp = true
targets = "X86;AArch64"
experimental-targets = ""


[rust]
channel = "dev"
optimize = "s"
codegen-tests = false

[install]
prefix = "build/1.83.0-custom-x86_64"
sysconfdir = "etc"