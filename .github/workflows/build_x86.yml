name: Build custom Rust (x86_64 binary)

on:
  push:
    branches:
      - '*'

jobs:
  job0_buildjob:
    name: Build job
    runs-on: macos-15
    if: ${{ contains(github.event.head_commit.message, 'BUILDX86') }}
    steps:
      - name: Checkout code
        id: checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 1

      - name: Select Xcode 16.0
        run: sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer

      - name: Restore cached LLVM 19 (Rust 1.82-1.86)
        id: cache-llvm-restore
        uses: actions/cache/restore@27d5ce7f107fe9357f9df03efb73ab90386fccae  # v5.0.5
        with:
          key: ${{ runner.os }}-llvm19-${{ github.run_id }}
          path: |
            build/x86_64-apple-darwin/llvm
            build/aarch64-apple-darwin/llvm
          restore-keys:
            ${{ runner.os }}-llvm19

      - name: Manually bootstrapping custom Rust
        run: |
          export RUST_BOOTSTRAP_VERSION=1.82.0
          mkdir /tmp/bootstrap
          cd /tmp/bootstrap
          curl -L https://github.com/aobaharuki2005/rust/releases/download/${RUST_BOOTSTRAP_VERSION}-custom/${RUST_BOOTSTRAP_VERSION}-custom-aarch64.zip -o ${RUST_BOOTSTRAP_VERSION}-custom-aarch64.zip
          unzip -q ${RUST_BOOTSTRAP_VERSION}-custom-aarch64.zip
      
      - name: Build and package
        run: |
          export SDKROOT=/Library/Developer/CommandLineTools/SDKs/MacOSX15.sdk
          export MACOSX_DEPLOYMENT_TARGET=10.7
          export MACOSX_STD_DEPLOYMENT_TARGET=10.7
          export LDFLAGS="-ld_classic"
          export VERSION=$(cat src/version)

          echo "========= Build environment variables: ============"
          printenv | grep -E "SDKROOT|MACOSX|LDFLAGS|VERSION"

          ### Shallow synchronize submodules
          echo "========= Fetching submodules =========="
          git submodule update --depth 1 --init --recursive

          ### Build Rustc and cargo
          echo "========= Building Rustc and cargo ========="
          echo "********* Symlink the configuration ... ********"
          ln -sf ./config-legacy-x86.toml ./config.toml
          echo "********* Here is the build configuration: ********"
          cat ./config.toml
          echo "********* Starting to build *********"
          /usr/bin/python3 ./x.py build --stage 2

          ### Install and package
          echo "========= Installing and packaging ====="
          /usr/bin/python3 ./x.py install
          cd build

          zip -qr $VERSION-custom-x86_64.zip ./$VERSION-custom-x86_64


      - name: Save built LLVM artifacts if it was not reused
        id: cache-llvm-save
        if: always()
        uses: actions/cache/save@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          key: ${{ runner.os }}-llvm19-${{ github.run_id }}
          path: |
            build/x86_64-apple-darwin/llvm
            build/aarch64-apple-darwin/llvm

      - name: Get Rust version
        run: echo "RUST_VERSION=$(cat src/version)" >> $GITHUB_ENV
          
      - name: Upload packaged Rust
        id: upload_packaged_rust
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with: 
          archive: false
          path: build/${{ env.RUST_VERSION }}-custom-x86_64.zip




